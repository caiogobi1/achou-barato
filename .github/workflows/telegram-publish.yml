name: Publicar ofertas no Telegram (manual)

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: telegram-offers
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Send up to two recently verified offers
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_send.py
      - name: Save deduplication history
        run: |
          if [ -f telegram-sent.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add telegram-sent.json
            if ! git diff --cached --quiet; then
              git commit -m "Track Telegram offers already published"
              git push
            fi
          fi
