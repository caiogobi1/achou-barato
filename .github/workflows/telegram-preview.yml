name: Previa de ofertas Telegram (sem envio)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Preview eligible offers only
        run: python scripts/telegram_preview.py --limit 2 --max-price-age-days 1
